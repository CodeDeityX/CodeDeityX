<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="48%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#07151a"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#28d7c0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#28d7c0" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#6aa8a0" stroke-width="0.7" opacity="0.11"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#background)"/>
  <rect width="1400" height="420" fill="url(#grid)"/>
  <rect width="1400" height="420" fill="url(#glow)"/>

  <line x1="110" y1="87" x2="1290" y2="87" stroke="#28d7c0" stroke-width="1" opacity="0.55"/>
  <line x1="110" y1="333" x2="1290" y2="333" stroke="#28d7c0" stroke-width="1" opacity="0.55"/>

  <circle cx="110" cy="87" r="4" fill="#28d7c0"/>
  <circle cx="1290" cy="87" r="4" fill="#28d7c0"/>
  <circle cx="110" cy="333" r="4" fill="#28d7c0"/>
  <circle cx="1290" cy="333" r="4" fill="#28d7c0"/>

  <text x="700" y="155" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="3">
    {{FULL_NAME_UPPER}}
  </text>

  <text x="700" y="216" text-anchor="middle" fill="#28d7c0" font-family="Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" filter="url(#softGlow)">
    {{PRIMARY_TITLE_UPPER}}
  </text>

  <text x="700" y="264" text-anchor="middle" fill="#b6c4d6" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="1">
    GOVERNANCE | VERIFICATION | QUALITY ASSURANCE | EVIDENCE
  </text>

  <text x="700" y="307" text-anchor="middle" fill="#72859b" font-family="Consolas, monospace" font-size="16" letter-spacing="1">
    {{BANNER_MOTTO}}
  </text>
</svg>